# Builds linux/amd64 + linux/arm64 and pushes to Docker Hub when a v*.*.* tag is pushed.
# Repository settings (Settings -> Secrets and variables -> Actions):
#   secret   DOCKERHUB_TOKEN      required: a Docker Hub access token with write access
#   DOCKERHUB_USERNAME            optional, as a variable or a secret; defaults to the
#                                 GitHub repository owner
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME || github.repository_owner }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build (amd64) and run the end-to-end smoke test
        run: make test

  publish:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Check Docker Hub token is configured
        env:
          TOKEN_SET: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          if [ "$TOKEN_SET" != "true" ]; then
            echo "::error::Secret DOCKERHUB_TOKEN is missing (Settings -> Secrets and variables -> Actions -> Secrets)."
            exit 1
          fi

      - uses: docker/login-action@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/otel-clickhouse-grafana
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Pre-releases such as v1.0.0-rc1 get their own tag but never "latest".
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
