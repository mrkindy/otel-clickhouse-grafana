# OpenTelemetry Collector Builder (ocb) manifest.
# Only what this image needs; versions match the official otelcol-contrib v0.165.0 manifest.
dist:
  name: otelcol
  description: OTLP -> ClickHouse collector for otel-clickhouse-grafana
  output_path: ./_build
  version: 0.165.0
  build_tags: "grpcnotrace"

receivers:
  - gomod: go.opentelemetry.io/collector/receiver/otlpreceiver v0.165.0

processors:
  - gomod: go.opentelemetry.io/collector/processor/memorylimiterprocessor v0.165.0

exporters:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/clickhouseexporter v0.165.0

extensions:
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/bearertokenauthextension v0.165.0
  - gomod: github.com/open-telemetry/opentelemetry-collector-contrib/extension/healthcheckextension v0.165.0

providers:
  - gomod: go.opentelemetry.io/collector/confmap/provider/envprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/fileprovider v1.71.0
  - gomod: go.opentelemetry.io/collector/confmap/provider/yamlprovider v1.71.0
